<title>Meja HR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail of HR modules + one working pane; rail becomes a scrolling tab strip on phones. */
:root {
  --bg: #f3f4f8;
  --surface: #ffffff;
  --sunk: #eceef5;
  --ink: #1a1f2e;
  --muted: #5b6275;
  --line: #dde1ea;
  --accent: #2f4aa0;       /* nila / indigo */
  --accent-ink: #ffffff;
  --accent-soft: #e5e9f8;
  --kunyit: #c98f0c;       /* turmeric highlight */
  --ok: #1d7f53;  --ok-soft: #ddf2e7;
  --warn: #a8660b; --warn-soft: #fbeccf;
  --bad: #b93a33; --bad-soft: #f9e0de;
  --leave: #6a55c9; --leave-soft: #ebe6fb;
  --off: #7c8396; --off-soft: #eceef3;
  --shadow: 0 1px 2px rgba(20,25,45,.06), 0 6px 24px rgba(20,25,45,.07);
  --f-body: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f121a; --surface: #171b26; --sunk: #1d2230; --ink: #e8ebf3; --muted: #9ba3b7; --line: #2a3142;
    --accent: #8ea2f0; --accent-ink: #0f121a; --accent-soft: #232c4a; --kunyit: #e3b341;
    --ok: #5cc794; --ok-soft: #173427; --warn: #e2a64a; --warn-soft: #3a2c14; --bad: #f08079; --bad-soft: #3d1e1d;
    --leave: #ad9df5; --leave-soft: #2a2447; --off: #8b92a6; --off-soft: #222735;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f121a; --surface: #171b26; --sunk: #1d2230; --ink: #e8ebf3; --muted: #9ba3b7; --line: #2a3142;
  --accent: #8ea2f0; --accent-ink: #0f121a; --accent-soft: #232c4a; --kunyit: #e3b341;
  --ok: #5cc794; --ok-soft: #173427; --warn: #e2a64a; --warn-soft: #3a2c14; --bad: #f08079; --bad-soft: #3d1e1d;
  --leave: #ad9df5; --leave-soft: #2a2447; --off: #8b92a6; --off-soft: #222735;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 232px minmax(0,1fr); min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 6px; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; letter-spacing: -.02em; }
.brand b { display: block; font-size: 15px; letter-spacing: -.01em; }
.brand small { display: block; color: var(--muted); font-size: 12px; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 9px 10px; border-radius: 8px; cursor: pointer; text-align: left; color: var(--muted); font-weight: 600; }
.nav button:hover { background: var(--sunk); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav .count { margin-left: auto; background: var(--kunyit); color: var(--surface); border-radius: 99px; font-size: 11px; padding: 0 7px; font-weight: 700; }
.rail-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 0 6px; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--off); margin-right: 6px; vertical-align: 1px; }
.dot.live { background: var(--ok); }
.dot.local { background: var(--kunyit); }

main { padding: 28px clamp(16px, 3vw, 40px) 60px; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
.head h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; line-height: 1.15; text-wrap: balance; }
.head p { margin: 4px 0 0; color: var(--muted); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: 11px; font-weight: 700; color: var(--muted); }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: none; border-color: transparent; color: var(--accent); padding-inline: 8px; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
input[type=text], input[type=number], input[type=date], input[type=time], input[type=email], input[type=tel], input[type=month], input[type=search], select, textarea {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; width: 100%;
}
textarea { resize: vertical; min-height: 64px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.span2 { grid-column: 1 / -1; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 500; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-h h2 { margin: 0; font-size: 15px; letter-spacing: -.01em; }
.panel-b { padding: 16px; }
.cols { display: grid; grid-template-columns: minmax(0,1.5fr) minmax(0,1fr); gap: 18px; align-items: start; }

.tiles { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.tile .v { font-size: 26px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 14px; color: var(--muted); font-weight: 600; }
.tile .k { font-size: 12px; color: var(--muted); font-weight: 600; }
.tile.alert .v { color: var(--kunyit); }
.meter { height: 5px; background: var(--sunk); border-radius: 9px; overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; background: var(--ok); border-radius: 9px; }

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
.mono { font-family: var(--f-mono); font-size: 13px; }
.who { display: flex; align-items: center; gap: 10px; min-width: 220px; }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; background: var(--accent-soft); color: var(--accent); }
.who b { display: block; font-weight: 600; line-height: 1.25; white-space: nowrap; }
.who small { color: var(--muted); font-size: 12px; }
.muted { color: var(--muted); }
.row-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: nowrap; }
tfoot td { font-weight: 700; border-top: 2px solid var(--line); }

.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 2px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--off-soft); color: var(--off); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.leave { background: var(--leave-soft); color: var(--leave); }
.chip.pending { background: var(--accent-soft); color: var(--accent); }
.tag { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--kunyit); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 1px; }

.seg { display: inline-flex; background: var(--sunk); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* Monthly register (buku kehadiran) */
.reg { font-size: 12px; }
.reg th, .reg td { padding: 6px 4px; text-align: center; }
.reg th.name, .reg td.name { text-align: left; padding-left: 12px; position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 150px; }
.reg th .dw { display: block; font-weight: 500; letter-spacing: 0; text-transform: none; font-size: 10px; }
.reg th.we { color: var(--off); }
.reg th.today { color: var(--accent); }
.cell { display: inline-grid; place-items: center; width: 24px; height: 22px; border-radius: 5px; font-weight: 700; font-size: 10.5px; }
.cell.ok { background: var(--ok-soft); color: var(--ok); }
.cell.warn { background: var(--warn-soft); color: var(--warn); }
.cell.bad { background: var(--bad-soft); color: var(--bad); }
.cell.leave { background: var(--leave-soft); color: var(--leave); }
.cell.off { color: var(--off); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; color: var(--muted); padding: 12px 16px; border-top: 1px solid var(--line); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1 1 180px; min-width: 0; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }
.empty .btn { margin-top: 12px; }

.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--kunyit) 35%, transparent); font-size: 13px; }
.banner .grow { flex: 1 1 240px; }

.clock { display: flex; flex-direction: column; gap: 4px; }
.clock .t { font-family: var(--f-mono); font-size: 34px; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.bal { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.bal div { background: var(--sunk); border-radius: 8px; padding: 8px 10px; }
.bal b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.bal small { color: var(--muted); font-size: 12px; }

/* Modal */
.scrim { position: fixed; inset: 0; background: rgba(10,14,25,.45); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); width: min(640px, 100%); max-height: calc(100% - 24px); overflow: auto; display: flex; flex-direction: column; }
.modal.wide { width: min(760px, 100%); }
.modal-h { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 2; }
.modal-h h3 { margin: 0; font-size: 17px; }
.modal-b { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.modal-f { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; position: sticky; bottom: 0; background: var(--surface); }
.modal-f .left { margin-right: auto; }
.note { font-size: 12px; color: var(--muted); }
.warnline { color: var(--warn); font-weight: 600; font-size: 13px; }

/* Payslip */
.slip { border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.slip-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 12px; }
.slip-top h4 { margin: 0; font-size: 16px; }
.slip dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; margin: 0; font-size: 13px; }
.slip dt { color: var(--muted); }
.slip dd { margin: 0; }
.slip-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.slip table td { padding: 5px 0; border: 0; }
.slip table td.num { text-align: right; }
.slip .sum td { border-top: 1px solid var(--line); font-weight: 700; padding-top: 7px; }
.net { display: flex; justify-content: space-between; align-items: baseline; background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; }
.net b { font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 9px; font-weight: 600; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

@media (max-width: 1100px) { .tiles { grid-template-columns: repeat(3, minmax(0,1fr)); } .cols { grid-template-columns: minmax(0,1fr); } }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0,1fr); }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; flex-direction: row; align-items: center; padding: 10px 12px; gap: 10px; border-right: 0; border-bottom: 1px solid var(--line); z-index: 10; }
  .brand small, .brand b, .rail-foot { display: none; }
  .nav { flex-direction: row; overflow-x: auto; scrollbar-width: none; }
  .nav button { white-space: nowrap; padding: 7px 10px; }
  main { padding-top: 20px; }
  .tiles { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .grid2, .grid3, .slip-cols { grid-template-columns: minmax(0,1fr); }
  .head h1 { font-size: 22px; }
}
@media (prefers-reduced-motion: no-preference) { .scrim { animation: fade .12s ease-out; } @keyframes fade { from { opacity: .4 } } }
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><div class="brand-mark" aria-hidden="true">HR</div><div><b>Meja HR</b><small id="brandCo">Memuatkan…</small></div></div>
    <nav class="nav" id="nav" aria-label="Modul"></nav>
    <div class="rail-foot" id="storeState"><span class="dot"></span>Menyambung…</div>
  </aside>
  <main id="main" aria-live="polite">
    <div class="empty"><b>Memuatkan data HR…</b>Pekerja, kehadiran dan cuti akan dipaparkan di sini.</div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => toISO(new Date());
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return toISO(d); };
const daysInMonth = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const monthDates = ym => Array.from({ length: daysInMonth(ym) }, (_, i) => `${ym}-${pad(i + 1)}`);
const shiftMonth = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const hm2min = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fmtDur = mins => mins == null || mins < 0 ? '—' : `${Math.floor(mins / 60)}j ${pad(mins % 60)}m`;
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const money = n => (r2(n || 0)).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const RM = n => 'RM ' + money(n);
const MONTHS = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
const DAYS = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
const fmtDate = s => { if (!s) return '—'; const d = parseISO(s); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)} ${d.getFullYear()}`; };
const fmtDateLong = s => { const d = parseISO(s); return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const fmtMonth = ym => { const [y, m] = ym.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; };
const initials = n => String(n || '?').split(/\s+/).filter(w => !/^(bin|binti|a\/l|a\/p|@)$/i.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o ?? {}));

const LEAVE = {
  AL: { name: 'Cuti Tahunan', short: 'Tahunan' },
  MC: { name: 'Cuti Sakit', short: 'Sakit' },
  EL: { name: 'Cuti Kecemasan', short: 'Kecemasan' },
  UL: { name: 'Cuti Tanpa Gaji', short: 'Tanpa gaji' },
  ML: { name: 'Cuti Bersalin', short: 'Bersalin' },
  PL: { name: 'Cuti Paterniti', short: 'Paterniti' },
};
const DEFAULT_SETTINGS = {
  company: 'Syarikat Anda Sdn. Bhd.', start: '09:00', end: '18:00', grace: 10,
  workdays: [1, 2, 3, 4, 5], elDays: 3, holidays: [],
};

/* ---------- state ---------- */
const S = { employees: {}, leaves: {}, attendance: {}, payroll: {}, settings: { ...DEFAULT_SETTINGS }, loaded: {} };
let UI = { view: 'dashboard', attTab: 'daily', date: today(), month: today().slice(0, 7), payMonth: today().slice(0, 7), q: '', showInactive: false, leaveFilter: 'Menunggu' };
let DB = null, DL = null, MODE = 'loading', readOnly = false;
try { const saved = JSON.parse(localStorage.getItem('mejahr.ui') || 'null'); if (saved && saved.view) UI.view = saved.view; } catch (e) {}
const COLLS = ['employees', 'leaves', 'attendance', 'payroll'];
const LOCAL_KEY = 'mejahr.data.v1';

/* ---------- storage adapter: shared db when available, this browser otherwise ---------- */
function loadLocal() {
  try { const d = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null'); if (d) { COLLS.forEach(c => { S[c] = {}; Object.entries(d[c] || {}).forEach(([id, v]) => S[c][id] = { ...v, id }); }); S.settings = { ...DEFAULT_SETTINGS, ...(d.settings || {}) }; } } catch (e) {}
  COLLS.forEach(c => S.loaded[c] = true); S.loaded.settings = true;
}
function saveLocal() {
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ employees: S.employees, leaves: S.leaves, attendance: S.attendance, payroll: S.payroll, settings: S.settings })); } catch (e) { toast('Pelayar ini tidak membenarkan simpanan setempat.'); }
}
function dbError(e) {
  const code = e && e.code;
  if (code === 'invalid_argument') { readOnly = true; return 'Anda hanya boleh melihat. Minta pemilik beri akses Contributor untuk menyimpan.'; }
  if (code === 'quota_exceeded') return 'Storan penuh. Padam rekod lama (contohnya data contoh) dan cuba lagi.';
  if (code === 'resource_exhausted') return 'Terlalu banyak perubahan serentak. Tunggu sebentar dan cuba lagi.';

/* Gaji: kadar peratusan anggaran. KWSP 11% pekerja; majikan 13% (gaji ≤ RM5,000) atau 12%.

function nextStaffNo() {
  const n = Object.values(S.employees).map(e => parseInt(String(e.staffNo || '').replace(/\D/g, ''), 10)).filter(Number.isFinite);

}

/* ---------- sample data (marked sample: true so it can be removed in one step) ---------- */
function buildSample(t) {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const people = [
    ['Nurul Aisyah binti Rahman', 'Sumber Manusia', 'Eksekutif HR', '2019-03-04', 4200, 300],
    ['Muhammad Hafiz bin Ismail', 'Operasi', 'Penyelia Operasi', '2021-07-12', 3800, 250],
    ['Tan Mei Ling', 'Kewangan', 'Akauntan', '2017-01-09', 6200, 400],
    ['Rajesh a/l Kumar', 'IT', 'Jurutera Perisian', '2023-02-20', 5500, 0],
    ['Siti Hajar binti Osman', 'Jualan', 'Eksekutif Jualan', '2024-09-02', 3000, 500],
    ['Lim Wei Jie', 'Operasi', 'Pembantu Stor', '2025-05-15', 2200, 150],
  ];
  const employees = {};
  people.forEach((p, i) => { const id = 'contoh-' + (i + 1); employees[id] = { sample: true, staffNo: 'P' + String(i + 1).padStart(3, '0'), name: p[0], dept: p[1], position: p[2], joinDate: p[3], salary: p[4], allowance: p[5], type: i === 5 ? 'Kontrak' : 'Tetap', status: 'Aktif', epf: true, phone: '01' + (2 + i) + '-' + (3000000 + i * 111111), ic: '', email: '', bank: 'Maybank', bankAcc: '1640' + (10000000 + i * 1234567), epfNo: '', alDays: '' }; });
  const ids = Object.keys(employees);
  const ym = t.slice(0, 7), leaves = {};
  const addLeave = (n, empId, type, from, to, status, reason) => { leaves['contoh-cuti-' + n] = { sample: true, empId, type, from, to, half: false, status, reason, createdAt: from + 'T01:00:00.000Z' }; };
  // pick workdays relative to today
  const wds = []; for (let d = ym + '-01'; d < t; d = addDays(d, 1)) if ([1, 2, 3, 4, 5].includes(parseISO(d).getDay())) wds.push(d);
  const future = []; for (let d = addDays(t, 1); future.length < 8; d = addDays(d, 1)) if ([1, 2, 3, 4, 5].includes(parseISO(d).getDay())) future.push(d);
  if (wds.length > 4) addLeave(1, ids[2], 'AL', wds[wds.length - 4], wds[wds.length - 3], 'Diluluskan', 'Balik kampung');
  if (wds.length > 6) addLeave(2, ids[4], 'MC', wds[3], wds[3], 'Diluluskan', 'Demam, sijil klinik');
  addLeave(3, ids[1], 'AL', future[2], future[4], 'Menunggu', 'Majlis perkahwinan adik');
  addLeave(4, ids[5], 'EL', future[0], future[0], 'Menunggu', 'Urusan keluarga');
  addLeave(5, ids[3], 'AL', future[5], future[5], 'Diluluskan', 'Urusan peribadi');
  const onLeave = (id, d) => Object.values(leaves).some(l => l.empId === id && l.status === 'Diluluskan' && l.from <= d && l.to >= d);
  const attendance = {};
  [...wds, t].forEach(d => {
    if (![1, 2, 3, 4, 5].includes(parseISO(d).getDay())) return;
    const records = {};
    ids.forEach((id, i) => {
      if (onLeave(id, d)) return;
      const r = rnd();
      if (d !== t && r < 0.04) return; // absent
      if (d === t && i >= 4) return;   // not in yet today
      const late = r > 0.86;
      const inMin = 8 * 60 + 38 + Math.floor(rnd() * 20) + (late ? 25 + Math.floor(rnd() * 20) : 0);
      const outMin = 18 * 60 + Math.floor(rnd() * 40);
      records[id] = { in: pad(Math.floor(inMin / 60)) + ':' + pad(inMin % 60), out: d === t ? '' : pad(Math.floor(outMin / 60)) + ':' + pad(outMin % 60), note: late && rnd() > 0.5 ? 'Kesesakan jalan raya' : '' };
    });
    if (Object.keys(records).length) attendance[d] = { sample: true, date: d, records };
  });
  Object.values(leaves).forEach(l => { l.days = 0; for (let d = l.from; d <= l.to; d = addDays(d, 1)) if ([1, 2, 3, 4, 5].includes(parseISO(d).getDay())) l.days++; });
  return { employees, leaves, attendance };
}
async function loadSample() {
  const data = buildSample(today());
  const ops = [];
  for (const c of ['employees', 'leaves', 'attendance']) for (const [id, v] of Object.entries(data[c])) {
    if (c === 'attendance' && S.attendance[id]) { const merged = clone(S.attendance[id]); delete merged.id; Object.assign(merged.records, v.records); ops.push([c, id, merged]); }
    else ops.push([c, id, v]);
  }
  if (!DB) { ops.forEach(([c, id, v]) => S[c][id] = { ...v, id }); saveLocal(); render(); toast('Data contoh dimuatkan'); return; }
  for (const [c, id, v] of ops) { if (!(await run(put(c, id, v)))) return; }
  toast('Data contoh dimuatkan');
}
async function clearSample() {
  const sampleIds = new Set(Object.values(S.employees).filter(e => e.sample).map(e => e.id || ''));
  Object.entries(S.employees).forEach(([id, e]) => { if (e.sample) sampleIds.add(id); });
  const ops = [];
  Object.keys(S.employees).forEach(id => sampleIds.has(id) && ops.push(() => remove('employees', id)));
  Object.entries(S.leaves).forEach(([id, l]) => (l.sample || sampleIds.has(l.empId)) && ops.push(() => remove('leaves', id)));
  Object.entries(S.attendance).forEach(([id, a]) => {
    const keep = Object.fromEntries(Object.entries(a.records || {}).filter(([k]) => !sampleIds.has(k)));
    if (Object.keys(keep).length === Object.keys(a.records || {}).length) return;
    const next = { date: a.date || id, records: keep };
    ops.push(() => Object.keys(keep).length ? put('attendance', id, next) : remove('attendance', id));
  });
  Object.entries(S.payroll).forEach(([id, p]) => {
    const has = Object.keys(p.inputs || {}).concat(Object.keys(p.lines || {})).some(k => sampleIds.has(k)); if (!has) return;
    const next = clone(p); delete next.id; [next.inputs, next.lines].forEach(o => o && Object.keys(o).forEach(k => sampleIds.has(k) && delete o[k]));
    ops.push(() => put('payroll', id, next));
  });
  for (const op of ops) { if (!(await run(op()))) return; }
  toast('Data contoh dibuang');
}

    ev.preventDefault(); const date = $('#holDate').value, name = $('#holName').value.trim(); if (!date || !name) return;
    const s = clone(S.settings); s.holidays = (s.holidays || []).filter(h => h.date !== date).concat({ date, name });
    run(putSettings(s), 'Cuti umum ditambah');
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('#modalRoot').innerHTML) closeModal(); });
setInterval(() => { const c = $('#liveClock'); if (c) c.textContent = nowHM(); }, 5000);
setInterval(() => { if (!$('#modalRoot').innerHTML && document.activeElement?.tagName !== 'INPUT') { const t = today(); if (UI.date !== t && UI._lastToday === UI.date) UI.date = t; UI._lastToday = t; scheduleRender(); } }, 60000);
UI._lastToday = today();

render();
initStore();
})();
</script>
