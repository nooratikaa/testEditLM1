<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meja HR</title>
<meta name="theme-color" content="#2f4aa0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail of HR modules + one working pane; rail becomes a scrolling tab strip on phones. */
:root {
  --bg: #f3f4f8;
  --surface: #ffffff;
  --sunk: #eceef5;
  --ink: #1a1f2e;
  --muted: #5b6275;
  --line: #dde1ea;
  --accent: #2f4aa0;       /* nila / indigo */
  --accent-ink: #ffffff;
  --accent-soft: #e5e9f8;
  --kunyit: #c98f0c;       /* turmeric highlight */
  --ok: #1d7f53;  --ok-soft: #ddf2e7;
  --warn: #a8660b; --warn-soft: #fbeccf;
  --bad: #b93a33; --bad-soft: #f9e0de;
  --leave: #6a55c9; --leave-soft: #ebe6fb;
  --off: #7c8396; --off-soft: #eceef3;
  --shadow: 0 1px 2px rgba(20,25,45,.06), 0 6px 24px rgba(20,25,45,.07);
  --f-body: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f121a; --surface: #171b26; --sunk: #1d2230; --ink: #e8ebf3; --muted: #9ba3b7; --line: #2a3142;
    --accent: #8ea2f0; --accent-ink: #0f121a; --accent-soft: #232c4a; --kunyit: #e3b341;
    --ok: #5cc794; --ok-soft: #173427; --warn: #e2a64a; --warn-soft: #3a2c14; --bad: #f08079; --bad-soft: #3d1e1d;
    --leave: #ad9df5; --leave-soft: #2a2447; --off: #8b92a6; --off-soft: #222735;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f121a; --surface: #171b26; --sunk: #1d2230; --ink: #e8ebf3; --muted: #9ba3b7; --line: #2a3142;
  --accent: #8ea2f0; --accent-ink: #0f121a; --accent-soft: #232c4a; --kunyit: #e3b341;
  --ok: #5cc794; --ok-soft: #173427; --warn: #e2a64a; --warn-soft: #3a2c14; --bad: #f08079; --bad-soft: #3d1e1d;
  --leave: #ad9df5; --leave-soft: #2a2447; --off: #8b92a6; --off-soft: #222735;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
img { max-width: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 232px minmax(0,1fr); min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 6px; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; letter-spacing: -.02em; }
.brand b { display: block; font-size: 15px; letter-spacing: -.01em; }
.brand small { display: block; color: var(--muted); font-size: 12px; max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 9px 10px; border-radius: 8px; cursor: pointer; text-align: left; color: var(--muted); font-weight: 600; }
.nav button:hover { background: var(--sunk); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav .count { margin-left: auto; background: var(--kunyit); color: var(--surface); border-radius: 99px; font-size: 11px; padding: 0 7px; font-weight: 700; }
.rail-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 0 6px; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--off); margin-right: 6px; vertical-align: 1px; }
.dot.live { background: var(--ok); }
.dot.local { background: var(--kunyit); }

main { padding: 28px clamp(16px, 3vw, 40px) 60px; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
.head h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; line-height: 1.15; text-wrap: balance; }
.head p { margin: 4px 0 0; color: var(--muted); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: 11px; font-weight: 700; color: var(--muted); }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: none; border-color: transparent; color: var(--accent); padding-inline: 8px; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
input[type=text], input[type=password], input[type=number], input[type=date], input[type=time], input[type=email], input[type=tel], input[type=month], input[type=search], select, textarea {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; width: 100%;
}
textarea { resize: vertical; min-height: 64px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.span2 { grid-column: 1 / -1; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 500; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-h h2 { margin: 0; font-size: 15px; letter-spacing: -.01em; }
.panel-b { padding: 16px; }
.cols { display: grid; grid-template-columns: minmax(0,1.5fr) minmax(0,1fr); gap: 18px; align-items: start; }

.tiles { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.tile .v { font-size: 26px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 14px; color: var(--muted); font-weight: 600; }
.tile .k { font-size: 12px; color: var(--muted); font-weight: 600; }
.tile.alert .v { color: var(--kunyit); }
.meter { height: 5px; background: var(--sunk); border-radius: 9px; overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; background: var(--ok); border-radius: 9px; }

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
.mono { font-family: var(--f-mono); font-size: 13px; }
.who { display: flex; align-items: center; gap: 10px; min-width: 220px; }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; background: var(--accent-soft); color: var(--accent); }
.who b { display: block; font-weight: 600; line-height: 1.25; white-space: nowrap; }
.who small { color: var(--muted); font-size: 12px; }
.muted { color: var(--muted); }
.row-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: nowrap; }
tfoot td { font-weight: 700; border-top: 2px solid var(--line); }

.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 2px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--off-soft); color: var(--off); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.leave { background: var(--leave-soft); color: var(--leave); }
.chip.pending { background: var(--accent-soft); color: var(--accent); }
.tag { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--kunyit); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 1px; }

.seg { display: inline-flex; background: var(--sunk); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* Monthly register (buku kehadiran) */
.reg { font-size: 12px; }
.reg th, .reg td { padding: 6px 4px; text-align: center; }
.reg th.name, .reg td.name { text-align: left; padding-left: 12px; position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 150px; }
.reg th .dw { display: block; font-weight: 500; letter-spacing: 0; text-transform: none; font-size: 10px; }
.reg th.we { color: var(--off); }
.reg th.today { color: var(--accent); }
.cell { border: 0; padding: 0; font: inherit; cursor: default; display: inline-grid; place-items: center; width: 24px; height: 22px; border-radius: 5px; font-weight: 700; font-size: 10.5px; }
button.cell { cursor: pointer; }
button.cell:hover { outline: 1px solid var(--muted); }
.cell.future { opacity: .45; }
.reg td.name .src { white-space: nowrap; }
.cell.ok { background: var(--ok-soft); color: var(--ok); }
.cell.warn { background: var(--warn-soft); color: var(--warn); }
.cell.bad { background: var(--bad-soft); color: var(--bad); }
.cell.leave { background: var(--leave-soft); color: var(--leave); }
.cell.off { color: var(--off); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; color: var(--muted); padding: 12px 16px; border-top: 1px solid var(--line); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1 1 180px; min-width: 0; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }
.empty .btn { margin-top: 12px; }

.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--kunyit) 35%, transparent); font-size: 13px; }
.banner .grow { flex: 1 1 240px; }

.bal { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.bal div { background: var(--sunk); border-radius: 8px; padding: 8px 10px; }
.bal b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.bal small { color: var(--muted); font-size: 12px; }

/* Modal */
.scrim { position: fixed; inset: 0; background: rgba(10,14,25,.45); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); width: min(640px, 100%); max-height: calc(100% - 24px); overflow: auto; display: flex; flex-direction: column; }
.modal.wide { width: min(760px, 100%); }
.modal-h { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 2; }
.modal-h h3 { margin: 0; font-size: 17px; }
.modal-b { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.modal-f { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; position: sticky; bottom: 0; background: var(--surface); }
.modal-f .left { margin-right: auto; }
.note { font-size: 12px; color: var(--muted); }
.warnline { color: var(--warn); font-weight: 600; font-size: 13px; }


.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 9px; font-weight: 600; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

@media (max-width: 1100px) { .tiles { grid-template-columns: repeat(3, minmax(0,1fr)); } .cols { grid-template-columns: minmax(0,1fr); } }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0,1fr); }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; flex-direction: row; align-items: center; padding: 10px 12px; gap: 10px; border-right: 0; border-bottom: 1px solid var(--line); z-index: 10; }
  .brand small, .brand b, .rail-foot { display: none; }
  .nav { flex-direction: row; overflow-x: auto; scrollbar-width: none; }
  .nav button { white-space: nowrap; padding: 7px 10px; }
  main { padding-top: 20px; }
  .tiles { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .grid2, .grid3, .slip-cols { grid-template-columns: minmax(0,1fr); }
  .head h1 { font-size: 22px; }
}
@media (prefers-reduced-motion: no-preference) { .scrim { animation: fade .12s ease-out; } @keyframes fade { from { opacity: .4 } } }
.prog { height: 8px; background: var(--sunk); border-radius: 9px; overflow: hidden; min-width: 110px; }
.prog i { display: block; height: 100%; border-radius: 9px; background: var(--ok); }
.prog i.warn { background: var(--kunyit); }
.prog i.bad { background: var(--bad); }
.li.sev-bad { box-shadow: inset 3px 0 0 var(--bad); }
.li.sev-warn { box-shadow: inset 3px 0 0 var(--kunyit); }
.li.sev-hr { box-shadow: inset 3px 0 0 var(--accent); }
.big { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.src { font-size: 11px; color: var(--muted); }

.login-wrap { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
.login { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 26px 24px; display: flex; flex-direction: column; gap: 14px; }
.login h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
.login .err { color: var(--bad); font-weight: 600; font-size: 13px; min-height: 1em; }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 0; }
.rail-foot b { display: block; color: var(--ink); }
.code { font-family: var(--f-mono); font-weight: 500; letter-spacing: .08em; background: var(--sunk); border-radius: 6px; padding: 2px 8px; }
</style>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
</head>
<body>
<div id="loginRoot" hidden></div>
<div class="app" hidden>
  <aside class="rail">
    <div class="brand"><div class="brand-mark" aria-hidden="true">HR</div><div><b>Meja HR</b><small id="brandCo">Memuatkan…</small></div></div>
    <nav class="nav" id="nav" aria-label="Modul"></nav>
    <div class="rail-foot" id="storeState"><span class="dot"></span>Menyambung…</div>
  </aside>
  <main id="main" aria-live="polite">
    <div class="empty"><b>Memuatkan data HR…</b>Baki cuti, permohonan, target dan amaran akan dipaparkan di sini.</div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => toISO(new Date());
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return toISO(d); };
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const daysInMonth = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const shiftMonth = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const money = n => (Number(n) || 0).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = n => (Number(n) || 0).toLocaleString('en-MY', { maximumFractionDigits: 2 });
const MONTHS = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
const DAYS = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
const fmtDate = s => { if (!s) return '—'; const d = parseISO(s); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)} ${d.getFullYear()}`; };
const fmtDateLong = s => { const d = parseISO(s); return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const fmtMonth = ym => { const [y, m] = ym.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; };
const fmtRange = l => fmtDate(l.from) + (l.to !== l.from ? ' – ' + fmtDate(l.to) : '') + (l.half ? ' (½ hari)' : '');
const initials = n => String(n || '?').split(/\s+/).filter(w => !/^(bin|binti|a\/l|a\/p|@)$/i.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o ?? {}));
const strip = o => { const c = clone(o); delete c.id; return c; };

const LEAVE = {
  AL: 'Cuti Tahunan', MC: 'Cuti Sakit', EL: 'Cuti Kecemasan', UL: 'Cuti Tanpa Gaji', ML: 'Cuti Bersalin', PL: 'Cuti Paterniti',
};
const WARN_LEVELS = ['Amaran lisan', 'Surat amaran 1', 'Surat amaran 2', 'Surat amaran terakhir'];
const DEFAULT_SETTINGS = {
  company: 'Syarikat Anda Sdn. Bhd.', workdays: [1, 2, 3, 4, 5], holidays: [],
  lowBal: 2, targetMin: 80, noticeDays: 3, pendingDays: 3, missStreak: 2,
};

/* ---------- state ---------- */
const CONFIG = window.MEJAHR_CONFIG || {};
const COLLS = ['employees', 'positions', 'leaves', 'targets', 'warnings', 'kehadiran'];
const S = { employees: {}, positions: {}, leaves: {}, targets: {}, warnings: {}, kehadiran: {}, settings: { ...DEFAULT_SETTINGS }, loaded: {} };
const UI = { view: 'dashboard', year: today().slice(0, 4), month: today().slice(0, 7), leaveFilter: 'Semua', q: '' };
let SB = null, ME = null, MODE = 'loading', readOnly = false, DL = null;
const isHR = () => ME?.role === 'hr';
const isMgr = () => ME?.role === 'hr' || ME?.role === 'boss';
const ROLE_LABEL = { staff: 'Staf', hr: 'HR', boss: 'Boss' };

/* ---------- Supabase: every read and write is filtered by the database's row level security ---------- */
function fail(error) { if (error) throw error; }
async function loadAll() {
  const tables = ['employees', 'positions', 'leaves', 'targets', 'warnings', 'attendance', 'settings'];

  const uidNow = (await SB.auth.getSession()).data.session?.user?.id;
  S.employees = {}; emp.forEach(r => { S.employees[r.id] = { ...r.data, id: r.id, staffNo: r.staff_no, role: r.role, userId: r.user_id, activationCode: r.activation_code }; });
  S.positions = {}; pos.forEach(r => { S.positions[r.id] = { ...r.data, id: r.id }; });

/* ---------- warning triggers: computed live from leave and target data ---------- */

    else if (a.balance <= (Number(s.lowBal) || 0)) out.push({ key: `al-low:${e.id}:${yr}`, empId: e.id, sev: 'warn', kind: 'info', title: 'Baki cuti tahunan rendah', detail: `Tinggal ${a.balance} daripada ${a.days} hari untuk ${yr}.` });

  $('#storeState').innerHTML = ME ? `<b>${esc(ME.name || ME.staffNo)}</b>${esc(ME.staffNo)} · ${ROLE_LABEL[ME.role] || ''}<br><button class="linkbtn" data-act="logout">Log keluar</button>` : '';
}
const who = (e, sub) => `<div class="who"><div class="av" aria-hidden="true">${esc(initials(e?.name))}</div><div><b>${esc(e?.name || 'Pekerja dipadam')}${e?.sample ? '<span class="tag">Contoh</span>' : ''}</b><small>${esc(sub ?? [e?.staffNo, posName(e)].filter(Boolean).join(' · '))}</small></div></div>`;
const statusChip = s => `<span class="chip ${s === 'Diluluskan' ? 'ok' : s === 'Ditolak' ? 'bad' : 'pending'}">${s === 'Diluluskan' ? '✓ ' : s === 'Ditolak' ? '✕ ' : '⏳ '}${esc(s)}</span>`;
const head = (title, sub, tools = '') => `<div class="head"><div><h1>${esc(title)}</h1>${sub ? `<p>${esc(sub)}</p>` : ''}</div><div class="tools">${tools}</div></div>`;
const yearTools = () => `<button class="btn sm" data-act="year-shift" data-n="-1" aria-label="Tahun sebelum">‹</button><span class="big" style="font-size:16px">${UI.year}</span><button class="btn sm" data-act="year-shift" data-n="1" aria-label="Tahun seterusnya">›</button>`;
const monthTools = () => `<button class="btn sm" data-act="month-shift" data-n="-1" aria-label="Bulan sebelum">‹</button><input type="month" id="tgtMonth" value="${UI.month}" style="width:auto" aria-label="Bulan"><button class="btn sm" data-act="month-shift" data-n="1" aria-label="Bulan seterusnya">›</button>`;
function sampleBanner() {
  return '';
  return `<div class="banner"><div class="grow"><b>Data contoh sedang dipaparkan.</b> Nama bertanda CONTOH hanyalah contoh. Tambah pekerja sebenar, kemudian buang data contoh.</div><button class="btn sm" data-act="clear-sample">Buang data contoh</button></div>`;
}
const noEmp = () => `<div class="panel"><div class="empty"><b>Belum ada pekerja</b>Tambah jawatan dan pekerja dahulu. Kelayakan cuti tahunan dan target bulanan boleh ditetapkan ikut jawatan.${isHR() ? '<br><button class="btn primary" data-act="emp-new">Tambah pekerja</button>' : ''}</div></div>`;

function trigItem(x, compact) {
  const e = empById(x.empId);
  const act = x.issued ? '<span class="chip ok">Amaran direkod</span>'
    : !isMgr() ? '<span class="chip">Makluman</span>'
    : x.kind === 'staff' && isHR() ? `<button class="btn sm" data-act="warn-new" data-emp="${x.empId}" data-key="${esc(x.key)}" data-reason="${esc(x.title + '. ' + x.detail)}">Rekod amaran</button>`
    : x.leaveId ? `<button class="btn sm" data-act="leave-decide" data-id="${x.leaveId}" data-s="Ditolak">Tolak</button><button class="btn sm primary" data-act="leave-decide" data-id="${x.leaveId}" data-s="Diluluskan">Lulus</button>`
    : '<span class="chip">Makluman</span>';
  return `<div class="li sev-${x.sev === 'hr' ? 'hr' : x.sev}"><div class="grow">${who(e, x.title)}<div class="note" style="margin:4px 0 0 40px">${esc(x.detail)}</div></div>${compact ? '' : ''}<div class="row-actions">${act}</div></div>`;
}

function viewDashboard() {
  if (!isMgr()) return viewMyDashboard();
  const list = emps(); const t = today(), yr = t.slice(0, 4), ym = t.slice(0, 7);
  if (!list.length) return head('Papan Utama', fmtDateLong(t)) + noEmp();
  const al = list.map(e => alSummary(e, yr));
  const pending = Object.values(S.leaves).filter(l => l.status === 'Menunggu').sort((a, b) => a.from.localeCompare(b.from));
  const trg = triggers().filter(x => !x.issued);
  const ts = list.map(e => targetStatus(e, ym)).filter(x => x.target);
  const hit = ts.filter(x => x.pct >= 100).length;
  const onLeave = list.filter(e => Object.values(S.leaves).some(l => l.empId === e.id && l.status === 'Diluluskan' && l.from <= t && l.to >= t)).length;
  return head('Papan Utama', fmtDateLong(t), `<button class="btn primary" data-act="leave-new">Mohon cuti</button>`) + sampleBanner() + `
  <div class="tiles">
    <div class="tile"><span class="k">Jumlah cuti tahunan ${yr}</span><span class="v">${r2(al.reduce((s, a) => s + a.days, 0))}<small> hari</small></span><span class="k">${r2(al.reduce((s, a) => s + a.taken, 0))} diambil · ${r2(al.reduce((s, a) => s + a.balance, 0))} baki</span></div>
    <div class="tile ${pending.length ? 'alert' : ''}"><span class="k">Cuti menunggu kelulusan</span><span class="v">${pending.length}</span></div>
    <div class="tile"><span class="k">Bercuti hari ini</span><span class="v">${onLeave}<small> / ${list.length}</small></span></div>
    <div class="tile"><span class="k">Capai target ${MONTHS[+ym.slice(5) - 1]}</span><span class="v">${hit}<small> / ${ts.length}</small></span><div class="meter"><i style="width:${ts.length ? hit / ts.length * 100 : 0}%"></i></div></div>
    <div class="tile ${trg.some(x => x.sev === 'bad') ? 'alert' : ''}"><span class="k">Amaran dicetuskan</span><span class="v">${trg.length}</span></div>
  </div>
  <div class="cols">
    <section class="panel"><div class="panel-h"><h2>Amaran dicetuskan</h2><button class="btn ghost sm" data-act="nav" data-v="warnings">Lihat semua</button></div>
      <div class="list">${trg.length ? trg.slice(0, 6).map(x => trigItem(x)).join('') : '<div class="empty">Tiada amaran. Semua baki cuti dan target dalam had.</div>'}</div></section>
    <section class="panel"><div class="panel-h"><h2>Permohonan cuti menunggu</h2><button class="btn ghost sm" data-act="nav" data-v="leave">Semua permohonan</button></div>
      <div class="list">${pending.length ? pending.slice(0, 6).map(pendingItem).join('') : '<div class="empty">Tiada permohonan untuk disemak.</div>'}</div></section>
  </div>`;
}
function pendingItem(l) {
  const e = empById(l.empId), a = e && l.type === 'AL' ? alSummary(e, l.from.slice(0, 4)) : null;
  return `<div class="li"><div class="grow">${who(e, `${LEAVE[l.type]} · ${fmtRange(l)} · ${l.days} hari`)}
    ${a ? `<div class="note" style="margin:4px 0 0 40px">Baki cuti tahunan ${a.balance} hari${a.balance - l.days < 0 ? ` · <span class="warnline">melebihi baki</span>` : ''}</div>` : ''}</div>
    <div class="row-actions"><button class="btn sm" data-act="leave-decide" data-id="${l.id}" data-s="Ditolak">Tolak</button><button class="btn sm primary" data-act="leave-decide" data-id="${l.id}" data-s="Diluluskan">Lulus</button></div></div>`;
}

function viewAttendance() {
  const list = emps(), ym = UI.month, dates = monthDates(ym), t = today();
  const tools = monthTools() + (canExport() && list.length ? '<button class="btn sm" data-act="export-att">Eksport CSV</button>' : '');
  if (!list.length) return head('Kehadiran', fmtMonth(ym), tools) + noEmp();
  const hdr = dates.map(d => { const dw = parseISO(d).getDay(), rest = !(S.settings.workdays || []).includes(dw) || holidayOn(d); return `<th class="${rest ? 'we' : ''} ${d === t ? 'today' : ''}" title="${esc(holidayOn(d)?.name || DAYS[dw])}">${Number(d.slice(8))}<span class="dw">${DAYS[dw][0]}</span></th>`; }).join('');
  let tot = { paid: 0, absent: 0, pay: 0 };
  const sums = list.map(e => { const x = attSummary(e, ym); tot.paid += x.paid; tot.absent += x.unpaidTotal; tot.pay += x.pay || 0; return { e, x }; });
  const body = list.map(e => `<tr><td class="name"><b>${esc(e.name)}</b>${e.sample ? '<span class="tag">Contoh</span>' : ''}<div class="src">${esc(e.staffNo)} · ${esc(e.payType || 'Bulanan')}</div></td>${dates.map(d => { const c = dayCell(e, d); return `<td>${c.lock || !isHR() ? `<span class="cell ${c.cls}" title="${esc(fmtDate(d) + ': ' + c.label + (c.code ? ' (ubah di Cuti)' : ''))}">${esc(c.code)}</span>` : `<button type="button" class="cell ${c.cls}" data-act="mark" data-emp="${e.id}" data-d="${d}" title="${esc(fmtDate(d) + ': ' + c.label)}" aria-label="${esc(e.name + ', ' + fmtDate(d) + ': ' + c.label)}" ${readOnly ? 'disabled' : ''}>${esc(c.code)}</button>`}</td>`; }).join('')}</tr>`).join('');
  return head('Kehadiran', `${fmtMonth(ym)} · hari bekerja untuk pembayaran gaji`, tools) + sampleBanner() + `
  <section class="panel"><div class="panel-h"><h2>Rekod sebulan</h2><span class="note">${isHR() ? 'Semua hari bekerja dikira <b>Hadir</b>. Klik sel: <b>H → TH → ½ → H</b>. Hari rehat: klik untuk <b>HK</b>. Cuti diluluskan diisi sendiri.' : 'Direkod oleh HR. Semua hari bekerja dikira Hadir kecuali ditanda.'}</span></div>
  <div class="tbl-wrap"><table class="reg"><thead><tr><th class="name">Pekerja</th>${hdr}</tr></thead><tbody>${body}</tbody></table></div>
  <div class="legend"><span><i class="cell ok">H</i>Hadir</span><span><i class="cell warn">½</i>Separuh hari</span><span><i class="cell bad">TH</i>Tidak hadir (tidak dibayar)</span><span><i class="cell leave">C</i>Cuti bergaji</span><span><i class="cell bad">CTG</i>Cuti tanpa gaji</span><span><i class="cell off">CU</i>Cuti umum (dibayar)</span><span><i class="cell ok">HK</i>Kerja hari rehat</span><span><i class="cell off">·</i>Hari rehat</span><span>Hari selepas hari ini dipaparkan pudar (dijangka hadir).</span></div></section>
  <section class="panel"><div class="panel-h"><h2>Ringkasan untuk gaji · ${fmtMonth(ym)}</h2></div>
  <div class="tbl-wrap"><table><thead><tr><th>Pekerja</th><th class="num">Hari kerja</th><th class="num">Hadir</th><th class="num">Cuti bergaji + CU</th><th class="num">Tak dibayar</th><th class="num">Kerja hari rehat</th><th class="num">Hari dibayar</th><th class="num">Anggaran gaji (RM)</th></tr></thead><tbody>
  ${sums.map(({ e, x }) => `<tr><td>${who(e, [e.staffNo, (e.payType || 'Bulanan') + (e.rate ? ` RM ${money(e.rate)}${e.payType === 'Harian' ? '/hari' : '/bulan'}` : '')].join(' · '))}</td><td class="num mono">${x.workdays}</td><td class="num mono">${x.worked}</td><td class="num mono">${r2(x.leave + x.ph) || '—'}</td><td class="num mono" style="color:${x.unpaidTotal ? 'var(--bad)' : 'inherit'}">${x.unpaidTotal || '—'}</td><td class="num mono">${x.extra || '—'}</td><td class="num"><span class="big" style="font-size:17px">${x.paid}</span></td><td class="num mono">${x.pay == null ? '<span class="muted">Isi gaji pada rekod pekerja</span>' : money(x.pay)}</td></tr>`).join('')}
  </tbody><tfoot><tr><td>Jumlah</td><td></td><td></td><td></td><td class="num mono">${r2(tot.absent)}</td><td></td><td class="num mono">${r2(tot.paid)}</td><td class="num mono">${money(tot.pay)}</td></tr></tfoot></table></div>
  <div class="legend"><span>Anggaran gaji: bulanan = gaji − (gaji ÷ 26 × hari tak dibayar); harian = kadar × (hari dibayar + kerja hari rehat). Bayaran lebih masa untuk hari rehat tidak dikira. Semak sebelum membayar.</span></div></section>`;
}

function viewMyDashboard() {
  const e = ME, t = today(), yr = t.slice(0, 4), ym = t.slice(0, 7);
  const a = alSummary(e, yr), tg = targetStatus(e, ym), att = attSummary(e, ym);
  const mine = Object.values(S.leaves).filter(l => l.empId === e.id).sort((x, y) => y.from.localeCompare(x.from));
  const trg = triggers().filter(x => x.empId === e.id && x.kind !== 'hr');
  const warns = Object.values(S.warnings).filter(w => w.empId === e.id);
  return head(`Hai, ${(e.name || '').split(' ')[0] || e.staffNo}`, fmtDateLong(t) + ' · ' + posName(e), `<button class="btn primary" data-act="leave-new">Mohon cuti</button>`) + `
  <div class="tiles">
    <div class="tile"><span class="k">Baki cuti tahunan ${yr}</span><span class="v">${a.balance}<small> / ${a.days} hari</small></span><span class="k">${a.taken} diambil${a.pending ? ` · ${a.pending} menunggu` : ''}</span></div>
    <div class="tile ${mine.some(l => l.status === 'Menunggu') ? 'alert' : ''}"><span class="k">Permohonan menunggu</span><span class="v">${mine.filter(l => l.status === 'Menunggu').length}</span></div>
    <div class="tile"><span class="k">Target ${MONTHS[+ym.slice(5) - 1]}</span><span class="v">${tg.target ? Math.round(tg.pct) + '<small>%</small>' : '—'}</span>${tg.target ? `<div class="meter"><i style="width:${Math.min(100, tg.pct)}%"></i></div>` : ''}</div>
    <div class="tile"><span class="k">Hari dibayar ${MONTHS[+ym.slice(5) - 1]}</span><span class="v">${att.paid}<small> / ${att.workdays}</small></span>${att.unpaidTotal ? `<span class="k" style="color:var(--bad)">${att.unpaidTotal} hari tak dibayar</span>` : ''}</div>
    <div class="tile ${warns.length ? 'alert' : ''}"><span class="k">Amaran diterima</span><span class="v">${warns.length}</span></div>
  </div>
  <div class="cols">
    <section class="panel"><div class="panel-h"><h2>Permohonan cuti saya</h2><button class="btn ghost sm" data-act="nav" data-v="leave">Lihat semua</button></div>
      <div class="list">${mine.length ? mine.slice(0, 6).map(l => `<div class="li"><div class="grow"><b>${esc(LEAVE[l.type])}</b> · ${l.days} hari<div class="note">${fmtRange(l)}${l.reason ? ' · ' + esc(l.reason) : ''}</div></div>${statusChip(l.status)}</div>`).join('') : '<div class="empty">Belum ada permohonan cuti.</div>'}</div></section>
    <section class="panel"><div class="panel-h"><h2>Peringatan</h2></div>
      <div class="list">${trg.length ? trg.map(x => `<div class="li sev-${x.sev}"><div class="grow"><b>${esc(x.title)}</b><div class="note">${esc(x.detail)}</div></div></div>`).join('') : '<div class="empty">Tiada peringatan. Teruskan!</div>'}</div></section>
  </div>`;
}

function viewAccount() {

  return head('Akaun Saya', `${e.staffNo} · ${ROLE_LABEL[e.role]}`) + `
  <div class="cols">
  <section class="panel"><div class="panel-h"><h2>Maklumat saya</h2></div><div class="panel-b"><dl style="display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0">
    <dt class="muted">Nama</dt><dd style="margin:0">${esc(e.name || '—')}</dd><dt class="muted">No. staf</dt><dd style="margin:0">${esc(e.staffNo)}</dd>
    <dt class="muted">Jawatan</dt><dd style="margin:0">${esc(posName(e))}</dd><dt class="muted">Jabatan</dt><dd style="margin:0">${esc(e.dept || '—')}</dd>
    <dt class="muted">Tarikh mula</dt><dd style="margin:0">${fmtDate(e.joinDate)}</dd><dt class="muted">Peranan</dt><dd style="margin:0">${ROLE_LABEL[e.role]}</dd></dl>
    <p class="note">Maklumat salah? Hubungi HR untuk membetulkannya.</p></div></section>

    <div class="field"><label for="pw2">Ulang kata laluan baharu</label><input type="password" id="pw2" minlength="8" autocomplete="new-password" required></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="submit">Tukar kata laluan</button><button class="btn" type="button" data-act="logout">Log keluar</button></div>
  </div></form></div>`;
}

function viewLeave() {
  const list = emps(), yr = UI.year;
  if (!list.length) return head('Cuti', '') + noEmp();
  const filters = ['Semua', 'Menunggu', 'Diluluskan', 'Ditolak'];
  const reqs = Object.values(S.leaves).filter(l => l.from.slice(0, 4) === yr && (UI.leaveFilter === 'Semua' || l.status === UI.leaveFilter)).sort((a, b) => b.from.localeCompare(a.from));
  const count = s => Object.values(S.leaves).filter(l => l.from.slice(0, 4) === yr && l.status === s).length;
  return head(isMgr() ? 'Cuti' : 'Cuti Saya', `Jumlah cuti tahunan dan permohonan ${yr}`, `${yearTools()}<button class="btn primary" data-act="leave-new">Mohon cuti</button>`) + sampleBanner() + `
  <section class="panel"><div class="panel-h"><h2>Jumlah cuti tahunan ${yr}</h2><span class="note">Baki = kelayakan − diluluskan. Yang menunggu belum ditolak dari baki.</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Pekerja</th><th class="num">Kelayakan</th><th class="num">Diambil</th><th class="num">Menunggu</th><th class="num">Baki</th><th style="min-width:140px">Guna</th></tr></thead><tbody>
    ${list.map(e => { const a = alSummary(e, yr), used = a.days ? Math.min(100, a.taken / a.days * 100) : 0; const cls = a.balance < 0 ? 'bad' : a.balance <= S.settings.lowBal ? 'warn' : ''; return `<tr><td>${who(e)}</td>
      <td class="num"><span class="mono">${a.days}</span><div class="src">${esc(a.src)}</div></td><td class="num mono">${a.taken}</td><td class="num mono">${a.pending || '—'}</td>
      <td class="num"><span class="big" style="color:${a.balance < 0 ? 'var(--bad)' : a.balance <= S.settings.lowBal ? 'var(--warn)' : 'inherit'}">${a.balance}</span></td>
      <td><div class="prog" title="${Math.round(used)}% digunakan"><i class="${cls}" style="width:${used}%"></i></div></td></tr>`; }).join('')}
    </tbody></table></div></section>
  <section class="panel"><div class="panel-h"><h2>Permohonan cuti</h2><div class="seg" role="group" aria-label="Tapis status">${filters.map(f => `<button data-act="leave-filter" data-f="${f}" aria-pressed="${UI.leaveFilter === f}">${f}${f !== 'Semua' ? ` (${count(f)})` : ''}</button>`).join('')}</div></div>
    ${reqs.length ? `<div class="tbl-wrap"><table><thead><tr><th>Pekerja</th><th>Jenis</th><th>Tarikh</th><th class="num">Hari</th><th>Sebab</th><th>Status</th><th></th></tr></thead><tbody>
    ${reqs.map(l => `<tr><td>${who(empById(l.empId))}</td><td style="white-space:nowrap">${esc(LEAVE[l.type] || l.type)}</td><td style="white-space:nowrap">${fmtRange(l)}<div class="src">Dipohon ${fmtDate((l.createdAt || '').slice(0, 10))}</div></td><td class="num mono">${l.days}</td><td class="muted" style="min-width:160px">${esc(l.reason || '')}</td><td>${statusChip(l.status)}</td>
      <td><div class="row-actions">${l.status === 'Menunggu' && isMgr() ? `<button class="btn sm" data-act="leave-decide" data-id="${l.id}" data-s="Ditolak">Tolak</button><button class="btn sm primary" data-act="leave-decide" data-id="${l.id}" data-s="Diluluskan">Lulus</button>` : ''}${isHR() || (l.status === 'Menunggu' && l.empId === ME.id) ? `<button class="btn sm ghost" data-act="leave-edit" data-id="${l.id}">Ubah</button>` : ''}</div></td></tr>`).join('')}
    </tbody></table></div>` : `<div class="empty">Tiada permohonan ${UI.leaveFilter === 'Semua' ? '' : 'berstatus “' + esc(UI.leaveFilter) + '” '}untuk ${yr}.</div>`}</section>`;
}

function viewTarget() {
  const list = emps(), ym = UI.month;
  if (!list.length) return head('Target Bulanan', '') + noEmp();
  const rows = list.map(e => ({ e, t: targetStatus(e, ym) }));
  const withT = rows.filter(r => r.t.target);
  const hit = withT.filter(r => r.t.pct >= 100).length;
  const pace = monthPace(ym);
  return head('Target Bulanan', `${fmtMonth(ym)}${pace > 0 && pace < 1 ? ` · ${Math.round(pace * 100)}% hari bekerja telah berlalu` : ''}`, monthTools()) + sampleBanner() + `
  <div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
    <div class="tile"><span class="k">Capai target</span><span class="v">${hit}<small> / ${withT.length}</small></span></div>
    <div class="tile"><span class="k">Purata pencapaian</span><span class="v">${withT.length ? Math.round(withT.reduce((s, r) => s + r.t.pct, 0) / withT.length) : 0}<small>%</small></span></div>
    <div class="tile"><span class="k">Bawah ${S.settings.targetMin}%</span><span class="v">${withT.filter(r => r.t.pct < S.settings.targetMin).length}</span></div>
  </div>
  <section class="panel"><div class="panel-h"><h2>Pencapaian ${fmtMonth(ym)}</h2><span class="note">${isHR() ? 'Target asal diambil daripada jawatan. Isi pencapaian, atau tukar target untuk bulan ini sahaja.' : 'Pencapaian dikemas kini oleh HR.'}</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Pekerja</th><th class="num">Target</th><th class="num">Pencapaian</th><th style="min-width:150px">Kemajuan</th><th>Status</th></tr></thead><tbody>
    ${rows.map(({ e, t }) => `<tr><td>${who(e)}</td>

    if (x.type === 'AL' && e) {
      const a = alSummary(e, x.from.slice(0, 4)); const own = id && S.leaves[id].type === 'AL' && S.leaves[id].status === 'Diluluskan' ? Number(S.leaves[id].days) : 0;
      const bal = r2(a.balance + own); msg += ` Baki cuti tahunan: ${bal} hari, selepas ini ${r2(bal - days)} hari.`;
      if (bal - days < 0) msg += ' <span class="warnline">⚠ Melebihi baki cuti tahunan.</span>';
      if (daysBetween(today(), x.from) < (Number(S.settings.noticeDays) || 0) && !id) msg += ` <span class="warnline">⚠ Notis kurang daripada ${S.settings.noticeDays} hari.</span>`;
    }
    $('#leaveCalc').innerHTML = msg;
  };
  $('#leaveForm').addEventListener('input', calc); calc();
  $('#leaveForm').addEventListener('submit', ev => {
    ev.preventDefault(); const x = read(); if (x.to < x.from) { toast('Semak tarikh cuti.'); return; }
    x.days = leaveDays(x); if (!x.days) { toast('Tempoh ini tiada hari bekerja.'); return; }
    if (x.from !== x.to) x.half = false;
    if (!id) x.createdAt = new Date().toISOString();
    if (x.status !== 'Menunggu' && (!id || S.leaves[id].status !== x.status)) x.decidedAt = new Date().toISOString();
    closeModal(); run(put('leaves', id || uid(), x), id ? 'Cuti dikemas kini' : x.status === 'Menunggu' ? 'Permohonan dihantar — menunggu kelulusan' : 'Cuti direkod');
  });
}
function warnModal({ id, empId, key, reason } = {}) {
  const w = id ? clone(S.warnings[id]) : { empId: empId || emps()[0]?.id, trigger: key || '', reason: reason || '', date: today() };
  if (!id) { const n = Object.values(S.warnings).filter(x => x.empId === w.empId).length; w.level = WARN_LEVELS[Math.min(n, WARN_LEVELS.length - 1)]; }
  const prior = Object.values(S.warnings).filter(x => x.empId === w.empId && x.id !== id).sort((a, b) => a.date.localeCompare(b.date));
  openModal(mh(id ? 'Ubah rekod amaran' : 'Rekod amaran') + `<form id="warnForm"><div class="modal-b">
    ${prior.length ? `<div class="note">Amaran terdahulu: ${prior.map(p => `${esc(p.level)} (${fmtDate(p.date)})`).join(', ')}</div>` : ''}
    <div class="grid2">
      <div class="field span2"><label for="wEmp">Pekerja</label><select id="wEmp" ${empId ? 'disabled' : ''}>${emps(true).map(e => `<option value="${e.id}" ${e.id === w.empId ? 'selected' : ''}>${esc(e.staffNo)} · ${esc(e.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="wLevel">Tahap</label><select id="wLevel">${WARN_LEVELS.map(l => `<option ${w.level === l ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="field"><label for="wDate">Tarikh</label><input type="date" id="wDate" value="${esc(w.date)}" required></div>
      <div class="field span2"><label for="wReason">Sebab</label><textarea id="wReason" required>${esc(w.reason)}</textarea></div>
    </div></div>${foot('Simpan amaran', id ? `<button type="button" class="btn danger left" data-act="warn-del" data-id="${id}">Padam</button>` : '')}</form>`);
  $('#warnForm').addEventListener('submit', ev => {
    ev.preventDefault();
    const o = { ...w, empId: $('#wEmp').value, level: $('#wLevel').value, date: $('#wDate').value, reason: $('#wReason').value.trim() };
    closeModal(); run(put('warnings', id || uid(), o), 'Amaran direkod');
  });
}

/* ---------- export ---------- */
const canExport = () => isMgr();
const csv = rows => rows.map(r => r.map(v => { const x = String(v ?? ''); return /[",\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }).join(',')).join('\n');
async function exportAttendance() {
  const ym = UI.month, dates = monthDates(ym);
  const rows = [['No. staf', 'Nama', 'Jawatan', 'Jenis gaji', ...dates.map(d => d.slice(8)), 'Hari kerja', 'Hadir', 'Cuti bergaji', 'Tak dibayar', 'Hari rehat kerja', 'Hari dibayar', 'Anggaran gaji']];
  emps().forEach(e => { const s = attSummary(e, ym); rows.push([e.staffNo, e.name, posName(e), e.payType || 'Bulanan', ...dates.map(d => dayCell(e, d).code), s.workdays, s.worked, s.leave + s.ph, s.unpaidTotal, s.extra, s.paid, s.pay == null ? '' : s.pay.toFixed(2)]); });
  const data = '﻿' + csv(rows), filename = `kehadiran-${ym}.csv`;
  if (DL) { try { await DL.save({ filename, data }); } catch (e) { if (e && e.code !== 'declined') toast('Fail tidak dapat disimpan di sini.'); } return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'text/csv' })); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- toast & events ---------- */
let toastTimer;
function toast(msg) { $('#toastRoot').innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastTimer); toastTimer = setTimeout(() => $('#toastRoot').innerHTML = '', 2800); }
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  if (a === 'modal-scrim') { if (ev.target === el) closeModal(); return; }
  switch (a) {
    case 'nav': UI.view = d.v; try { localStorage.setItem('mejahr.ui', JSON.stringify({ view: UI.view })); } catch (e) {} render(); window.scrollTo(0, 0); break;
    case 'modal-close': closeModal(); break;
    case 'confirm-ok': { const f = MODAL.onOk; closeModal(); f && f(); break; }
    case 'year-shift': UI.year = String(Number(UI.year) + Number(d.n)); render(); break;
    case 'month-shift': UI.month = shiftMonth(UI.month, Number(d.n)); render(); break;
    case 'leave-filter': UI.leaveFilter = d.f; render(); break;
    case 'leave-new': leaveModal(); break;
    case 'leave-edit': leaveModal(d.id); break;
    case 'leave-del': confirmModal('Padam permohonan cuti?', 'Permohonan ini akan dibuang dan baki cuti dikira semula.', 'Padam', () => run(remove('leaves', d.id), 'Permohonan dipadam')); break;
    case 'leave-decide': { const l = strip(S.leaves[d.id]); l.status = d.s; l.decidedAt = new Date().toISOString(); run(put('leaves', d.id, l), d.s === 'Diluluskan' ? 'Cuti diluluskan' : 'Cuti ditolak'); break; }
    case 'emp-new': empModal(); break;
    case 'emp-edit': empModal(d.id); break;
    case 'emp-del': confirmModal('Padam rekod pekerja?', `Rekod <b>${esc(S.employees[d.id]?.name)}</b> akan dipadam. Jika pekerja sudah berhenti, lebih baik tukar status kepada <b>Berhenti</b> supaya sejarah cuti dan amaran kekal.`, 'Padam', () => run(remove('employees', d.id), 'Rekod dipadam')); break;
    case 'pos-new': posModal(); break;
    case 'pos-edit': posModal(d.id); break;
    case 'pos-del': confirmModal('Padam jawatan?', 'Jawatan ini akan dibuang.', 'Padam', () => run(remove('positions', d.id), 'Jawatan dipadam')); break;
    case 'warn-new': warnModal({ empId: d.emp, key: d.key, reason: d.reason }); break;
    case 'warn-edit': warnModal({ id: d.id }); break;
    case 'warn-del': confirmModal('Padam rekod amaran?', 'Rekod amaran ini akan dibuang. Jika pencetusnya masih berlaku, ia akan muncul semula dalam senarai.', 'Padam', () => run(remove('warnings', d.id), 'Amaran dipadam')); break;
    case 'hol-del': { const s = clone(S.settings); s.holidays = (s.holidays || []).filter(h => h.date !== d.d); run(putSettings(s), 'Cuti umum dibuang'); break; }
    case 'mark': {
      const e = empById(d.emp), c = dayCell(e, d.d), cur = S.kehadiran[d.d.slice(0, 7)]?.marks?.[d.emp]?.[d.d.slice(8)] || '';
      const next = c.rest ? (cur === 'HK' ? '' : 'HK') : ({ '': 'TH', TH: 'H2', H2: '' }[cur] ?? '');
      run(putMark(d.d.slice(0, 7), d.emp, d.d.slice(8), next)); break;
    }
    case 'export-att': exportAttendance(); break;
    case 'logout': SB.auth.signOut(); break;
    case 'login-mode': showLogin(d.m); break;
    case 'emp-reset': confirmModal('Tetapkan semula log masuk?', `Kata laluan lama <b>${esc(S.employees[d.id]?.name)}</b> tidak boleh digunakan lagi. Kod aktivasi baharu akan dijana untuk mereka aktifkan semula akaun.`, 'Tetapkan semula', () => run(resetLogin(d.id), 'Kod aktivasi baharu dijana')); break;
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'tgtMonth' && t.value) { UI.month = t.value; render(); }
  else if (t.classList.contains('tgt-in')) {
    const v = t.value === '' ? '' : Number(t.value);
    const en = { ...(S.targets[UI.month]?.entries?.[t.dataset.emp] || {}), [t.dataset.k]: v };
    run(putTarget(UI.month, t.dataset.emp, en));
  }
});
document.addEventListener('input', ev => { if (ev.target.id === 'empSearch') { UI.q = ev.target.value; render(); } });
document.addEventListener('submit', ev => {
  if (ev.target.id === 'loginForm') { ev.preventDefault(); doLogin(ev.target); return; }
  if (ev.target.id === 'pwForm') {
    ev.preventDefault(); const p1 = $('#pw1').value, p2 = $('#pw2').value;
    if (p1 !== p2) { toast('Kata laluan tidak sama.'); return; }
    SB.auth.updateUser({ password: p1 }).then(r => { if (r.error) toast('Tidak dapat menukar: ' + r.error.message); else { toast('Kata laluan ditukar'); ev.target.reset(); } });
    return;
  }
  if (ev.target.id === 'settingsForm') {
    ev.preventDefault(); const f = new FormData(ev.target);
    const s = { ...clone(S.settings), company: String(f.get('company')).trim(), workdays: f.getAll('wd').map(Number) };
    ['lowBal', 'targetMin', 'missStreak', 'noticeDays', 'pendingDays'].forEach(k => s[k] = Number(f.get(k)) || 0);
    if (!s.workdays.length) { toast('Pilih sekurang-kurangnya satu hari bekerja.'); return; }
    run(putSettings(s), 'Tetapan disimpan');
  } else if (ev.target.id === 'holForm') {
    ev.preventDefault(); const date = $('#holDate').value, name = $('#holName').value.trim(); if (!date || !name) return;
    const s = clone(S.settings); s.holidays = (s.holidays || []).filter(h => h.date !== date).concat({ date, name });
    run(putSettings(s), 'Cuti umum ditambah');
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('#modalRoot').innerHTML) closeModal(); });

initStore();
})();
</script>
